# Actualiza el portal de proveedores 3 veces por día y lo publica en GitHub Pages.
# Los horarios de "cron" están en hora UTC (Argentina = UTC-3).
name: Actualizar portal de proveedores

on:
  schedule:
    - cron: "0 10 * * *"   # 07:00 hs Argentina
    - cron: "0 17 * * *"   # 14:00 hs Argentina
    - cron: "0 20 * * *"   # 17:00 hs Argentina
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano

permissions:
  contents: write

concurrency:
  group: portal-proveedores
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar librerías
        run: pip install -r requirements.txt
      - name: Generar portal
        env:
          DRIVIN_API_KEY: ${{ secrets.DRIVIN_API_KEY }}
        run: python generar_portal.py
      - name: Guardar y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "Actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
